name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]
        angular: [21, 22]

    name: Node ${{ matrix.node-version }} / Angular ${{ matrix.angular }}

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install -g npm@12
      - run: npm install
      - run: echo "PUGLITE_DEMO_DIR=$RUNNER_TEMP/demo-ng${{ matrix.angular }}" >> "$GITHUB_ENV"
      - run: node scripts/demo-angular.js ${{ matrix.angular }} "$PUGLITE_DEMO_DIR"
      - run: npm test
